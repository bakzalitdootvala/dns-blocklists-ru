name: Ложная блокировка
description: Обычный сайт или его функция перестали работать из-за фильтра.
labels: [bug, report]
body:
  - type: markdown
    attributes:
      value: Укажите конкретный домен и правило. Не публикуйте пароли, токены и историю посещений.
  - type: textarea
    id: domain
    attributes:
      label: Какой домен блокируется?
      description: Домен, категория, совпавшее правило и идентификатор фильтра из AdGuard Home.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести проблему?
      description: Какое действие должно работать и что происходит с фильтром и без него.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Версия данных
      description: SHA256 и verified_at из manifest.json, версия AdGuard Home.
