name: Предложение источника или правила
description: Новый источник или подтверждённый домен для разрешённых категорий.
labels: [report]
body:
  - type: textarea
    id: evidence
    attributes:
      label: Источник и доказательство
      description: URL источника, категория, лицензия и дата наблюдения. География сама по себе не основание.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Область правила и возможные ложные блокировки
      description: Только указанное имя (exact) или вместе с поддоменами (suffix); какие обычные сайты могут пострадать.
    validations:
      required: true
