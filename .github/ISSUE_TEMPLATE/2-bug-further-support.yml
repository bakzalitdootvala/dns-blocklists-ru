name: Проблема сборки или обновления
description: Ошибка загрузки источника, проверки или публикации фильтра.
labels: [support, report]
body:
  - type: textarea
    id: command
    attributes:
      label: Команда или запуск GitHub Actions
      description: Укажите ссылку на запуск либо команду без секретов.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Ошибка
      description: Приведите сообщение и ожидаемый результат; удалите токены и персональные данные.
    validations:
      required: true
