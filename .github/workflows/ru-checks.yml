# Назначение: проверить собственный код форка и уже собранный фильтр без обновления источников.
# Запуск: push в main, pull request в main (предложение изменений) или ручной запуск.
# Входы: scripts/ru/, tests/, config/, regional/ru-cis/, output/adguard/ и рабочее дерево.
# Ruff проверяет ошибки/формат Python, unittest — поведение, pipeline validate — каталог,
# check_artifact — совпадение combined.txt с manifest.json, Gitleaks — признаки секретов.
# Скачанные инструменты проверяются ClamAV до запуска; их версии закреплены ниже.
# Ошибка любой проверки завершает job неуспешно. Результат — журналы GitHub Actions.
# Job не собирает свежий combined.txt, не делает commit/push и не подключается к VPS.
# Значения терминов: docs/GLOSSARY.md. Назначение соседних заданий: README.md этого каталога.
name: Проверить сборщик, региональные правила, combined.txt и отсутствие секретов

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Проверить Python-код, данные каталога и готовый фильтр
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать проверяемый код без сохранения GitHub-токена в Git
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Установить Python 3.12 для сборщика и тестов
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Скачать Ruff и Gitleaks, проверить ClamAV и установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          mkdir -p .cache/check-tools
          python -m pip download --only-binary=:all: --no-deps ruff==0.17.3 -d .cache/check-tools
          curl --fail --silent --show-error --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .cache/check-tools/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .cache/check-tools/gitleaks.tar.gz' | sha256sum -c
          clamscan --infected .cache/check-tools
          python -m pip install --no-index --find-links=.cache/check-tools ruff==0.17.3
          tar -xzf .cache/check-tools/gitleaks.tar.gz --no-same-owner -C .cache/check-tools gitleaks
      - name: Проверить Python, выполнить тесты и проверить региональный каталог
        run: |
          ruff check scripts/ru tests
          ruff format --check scripts/ru tests
          python -m unittest discover -s tests -v
          python scripts/ru/pipeline.py validate
          git diff --check
      - name: Сверить SHA256 и число правил combined.txt с manifest.json
        run: python scripts/ru/check_artifact.py
      - name: Проверить файлы репозитория Gitleaks на случайно записанные секреты
        run: .cache/check-tools/gitleaks dir --redact --no-banner .
